<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stellar</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>

  <aside id="left">
    <h1>stellar</h1>
    <button id="new">+ new session</button>
    <h2>sessions</h2>
    <ul id="sessions"></ul>
  </aside>

  <section id="center">
    <div id="messages"></div>
    <form id="composer">
      <input id="input" autocomplete="off" autofocus
             placeholder="ask it to write itself a tool…">
      <button id="send">send</button>
    </form>
  </section>

  <aside id="right">
    <h2>mounted</h2>
    <ul id="mounted"></ul>
    <h2>internal</h2>
    <ul id="internal"></ul>
    <h2>external</h2>
    <ul id="external"></ul>
  </aside>

</main>
<script src="/app.js"></script>
</body>
</html>
